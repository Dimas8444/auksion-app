<!doctype html>
<html lang="uz"><head><title>Қўнғироқ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#F3F1EC;--ink:#16213E;--mute:#5E6678;--green:#1F7A4D}
@media (prefers-color-scheme:dark){:root{--bg:#0F1524;--ink:#EEF0F6;--mute:#9AA3BA;--green:#3FA86E}}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center}
a{display:block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:20px;padding:16px 24px;border-radius:14px;margin:16px 0}
p{color:var(--mute);margin:0}
</style></head><body>
<div>
<!-- Mini App (02.11): Telegram не открывает tel: внутри приложения — эта страница открывается во внешнем браузере
     и сразу переходит на tel:, телефон показывает звонилку. Кнопка — если переход не сработал сам. -->
<p>Қўнғироқ қилиш учун тугмани босинг</p>
<a id="call" href="#">📞</a>
<p>Иловага қайтиш учун бу саҳифани ёпинг</p>
</div>
<script>
var n=(new URLSearchParams(location.search).get("n")||"").replace(/[^\d+]/g,"");
var a=document.getElementById("call");
if(n){a.href="tel:"+n;a.textContent="📞 "+n.replace(/^\+?(998)(\d{2})(\d{3})(\d{2})(\d{2})$/,"+$1 $2 $3 $4 $5");location.href="tel:"+n}
else{a.hidden=true}
</script>
</body></html>
