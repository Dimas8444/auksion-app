<!doctype html>
<html lang="uz"><head><title>Аукцион савдолар</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#16213E;--mute:#5E6678;--line:#E0DDD4;--gold:#B07C22;--goldbg:#FBF3E1;--green:#1F7A4D;--btn:#16213E;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1524;--card:#18203A;--ink:#EEF0F6;--mute:#9AA3BA;--line:#2A3454;--gold:#E0B25A;--goldbg:#2A2415;--green:#58C98E;--btn:#E0B25A;--btnink:#16213E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1524;--card:#18203A;--ink:#EEF0F6;--mute:#9AA3BA;--line:#2A3454;--gold:#E0B25A;--goldbg:#2A2415;--green:#58C98E;--btn:#E0B25A;--btnink:#16213E;color-scheme:dark}
*{box-sizing:border-box}
/* Прокручивается не страница, а блок #sc: если документ сам не скроллится, свайп вниз в начале ленты
   не доходит до Telegram и не сворачивает Mini App (disableVerticalSwipes помог не во всех клиентах) */
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "PT Sans",system-ui,sans-serif;margin:0}
#sc{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font:700 22px/1.2 "PT Serif",Georgia,serif;margin:18px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:6px;z-index:5}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.list{display:grid;gap:12px;margin-top:12px}
.lot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.gal{position:relative;margin:-14px -14px 4px;border-radius:12px 12px 0 0;overflow:hidden;background:var(--line)}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.ph{flex:0 0 100%;width:100%;aspect-ratio:16/10;object-fit:cover;scroll-snap-align:start;display:block}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:10px;pointer-events:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:34px;cursor:pointer;padding:0}
.nav.l{left:8px}.nav.r{right:8px}
.nav:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font:700 17px/1.25 "PT Serif",Georgia,serif;min-width:0}
.name a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.disc{background:var(--goldbg);color:var(--gold);font-weight:700;font-size:20px;line-height:1.1;border-radius:8px;padding:5px 11px;white-space:nowrap}
.meta{color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.addr{color:var(--ink);font-size:14px;line-height:1.35}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.now{font-size:19px;font-weight:700;color:var(--green)}
.old{color:var(--mute);text-decoration:line-through}
.date{font-size:17px;font-weight:700;color:var(--ink);background:var(--goldbg);border-radius:8px;padding:9px 12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{display:block;text-align:center;background:var(--btn);color:var(--btnink);text-decoration:none;border-radius:10px;padding:11px 8px;font-weight:700}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.note{margin-top:14px;font-size:12px;color:var(--mute)}
.empty{color:var(--mute);padding:24px 0;text-align:center}
.filter{display:flex;align-items:center;gap:8px;margin-top:10px}
.filter label{color:var(--mute);font-size:14px;white-space:nowrap}
.filter select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;appearance:auto}
.filter select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.count{color:var(--mute);font-size:13px;margin-top:8px}
.search{position:relative;margin:4px 0 8px}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 40px 10px 38px;-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:18px;cursor:pointer}
.search button:focus-visible{outline:2px solid var(--gold)}
.tabs.off{display:none}
.tabs{flex-wrap:wrap}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.subs[hidden]{display:none}
.tab.sub{padding:6px 4px;font-size:13px;line-height:1.25;background:transparent;border-radius:10px;text-align:center;min-width:0}
.tab.sub[aria-selected="true"]{background:var(--goldbg);color:var(--gold);border-color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips[hidden]{display:none}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* Карточка лота внутри приложения (30.10): «Лотни кўриш» больше не уводит в канал — на iPhone Telegram
   долго листал канал до старого поста */
#det{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:28px}
#det[hidden]{display:none}
.dbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dcard{display:grid;gap:10px;max-width:560px;margin:0 auto}
.dcard .gal{margin:0;border-radius:12px}
.dcard .ph{aspect-ratio:4/3}
.dcard .name{font-size:21px;margin:0}
.rows{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0;padding:4px 14px}
.rows div{display:grid;grid-template-columns:minmax(0,42%) 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows div:last-child{border-bottom:0}
.rows dt{color:var(--mute);font-size:14px}
.rows dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.rows div.wide{grid-template-columns:1fr}
.dnote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.dnote b{display:block;color:var(--mute);font-weight:400;margin-bottom:4px}
.btns.one{grid-template-columns:1fr}
.go.chan{margin-top:-2px}   /* «Каналдаги постни очиш» — полноценная кнопка (решение пользователя 30.10) */
</style></head><body>
<div id="sc"><div class="wrap">
<h1>Аукцион савдолар</h1>
<form class="search" role="search" id="sform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="q" placeholder="Машина номини киритинг…" aria-label="Машина номи ёки лот рақами бўйича қидириш" autocomplete="off" enterkeyhint="search"><button type="button" id="qx" aria-label="Тозалаш" hidden>✕</button></form>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="subs" role="tablist" id="subs" aria-label="Кўчмас мулк тури" hidden></div>
<div class="chips" id="chips" aria-label="Ер участкаси нима учун" hidden></div>
<div class="filter"><label for="reg">Вилоят:</label><select id="reg"></select></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>
<p class="note" id="note"></p>
</div></div>
<div id="det" hidden role="dialog" aria-modal="true" aria-label="Лот"></div>
<script>
var CATS=[["avto","Енгил авто"],["yuk","Юк ва махсус техника"],["mulk","Кўчмас мулк"],["qishloq","Қишлоқ хўжалиги ерлари"]];
var ADMIN="https://t.me/auksion_admin";
// «Ариза бериш» открывает чат с админом с уже набранным текстом о лоте (решение пользователя 29.10:
// админ должен видеть, о каком лоте речь) — клиенту остаётся нажать «Отправить»
// Коротко (29.10: длинный текст не нужен) — номер лота однозначно определяет лот, название — для глаза.
// (30.10 пробовали заявку через бот с проверкой подписки — пользователь вернул этот вариант)
function orderLink(x){var name=String(x.title||"").replace(/\s+/g," ").trim();if(name.length>30)name=name.slice(0,29)+"…";
 return ADMIN+"?text="+encodeURIComponent("Ариза: Лот № "+(x.lot_number||x.id)+(name?" — "+name:""))}
var CH={avto:"https://t.me/avto_auksion_uz",yuk:"https://t.me/gruzovoeavto",mulk:"https://t.me/kuchmasmulk_uz",qishloq:"https://t.me/kuchmasmulk_uz"};
// Подразделы вкладок (поле лота sub): кўчмас мулк — 28.10, юк — 29.10 (грузовые / автобусы / спецтехника,
// чтобы у каждого был свой топ и экскаватор со ★10 не терялся за грузовиками). Первый — по умолчанию.
var SUBS={mulk:[["turar","Турар-жой"],["noturar","Нотурар-жой"],["yer","Ер участкалари"]],
 yuk:[["yuk","Юк машиналари"],["avtobus","Автобуслар"],["maxsus","Махсус техника"]]};
var SUBDEF={mulk:"noturar",yuk:"yuk"};   // если у старого лота нет sub
function subOf(x){return x.sub||SUBDEF[x.cat]}
// Внутри «Ер участкалари» — фильтр по назначению (поле tags, метки не взаимоисключающие:
// участок под многоэтажку часто продаётся правом аренды и есть и в «Кўп қаватли», и в «Ижарага»)
var LTAGS=[["","Барчаси"],["yakka","Хусусий уй учун"],["kop","Кўп қаватли уй учун"],["noturar","Нотурар қурилиш учун"],["ijara","Ижарага"]];
var BYID={},DET=null,DETWAIT=false,OPEN=null;
var cur="avto",SUB={mulk:"turar",yuk:"yuk"},ltag="",LOTS=[],REG="",Q="",ALL=null,ALLWAIT=false;
// Поиск: «lacetti» / «ласетти» / «Lacetti-2» сравниваются одинаково — кириллица в латиницу,
// c/q/x/y и двойные буквы приводятся к одному виду, пробелы и дефисы убираются.
var CYR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o","қ":"q","ғ":"g","ҳ":"h"};
function norm(s){s=String(s||"").toLowerCase().replace(/[а-яёўқғҳ]/g,function(ch){return CYR[ch]||ch});
 return s.replace(/c(?=[eiy])/g,"s").replace(/c/g,"k").replace(/q/g,"k").replace(/x/g,"ks").replace(/y/g,"i").replace(/jentra/g,"gentra").replace(/[^a-z0-9]/g,"").replace(/(.)\1+/g,"$1")}
function found(){var raw=Q.trim(),n=norm(raw);if(!n)return [];
 // результаты поиска — топ: сначала самые популярные (по избранному), решение пользователя 30.10
 return (ALL||LOTS).filter(function(x){return /^\d{5,}$/.test(raw)?String(x.lot_number||"").indexOf(raw)>=0:norm(x.title).indexOf(n)>=0})
  .sort(function(a,b){return (b.fav||0)-(a.fav||0)})}
function loadAll(){if(ALL||ALLWAIT)return;ALLWAIT=true;fetch("search.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){ALL=j;render()}).catch(function(){ALL=LOTS;render()})}
var qT;
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="q"){clearTimeout(qT);qT=setTimeout(function(){Q=ev.target.value;document.getElementById("qx").hidden=!Q;if(Q.trim())loadAll();render()},200)}});
document.addEventListener("submit",function(ev){if(ev.target.id==="sform"){ev.preventDefault();document.getElementById("q").blur()}});
document.addEventListener("click",function(ev){if(ev.target&&ev.target.id==="qx"){var i=document.getElementById("q");i.value="";Q="";ev.target.hidden=true;render();i.focus()}});
try{REG=localStorage.getItem("reg")||""}catch(e){}
document.addEventListener("change",function(ev){if(ev.target&&ev.target.id==="reg"){REG=ev.target.value;try{localStorage.setItem("reg",REG)}catch(e){}render()}});
function regions(items){var c={};items.forEach(function(x){if(x.region){c[x.region]=(c[x.region]||0)+1}});return Object.keys(c).sort(function(a,b){return a.localeCompare(b,"uz")}).map(function(r){return [r,c[r]]})}
var tw=window.Telegram&&window.Telegram.WebApp;if(tw){try{tw.ready();tw.expand()}catch(e){}
 // Свайп вниз по ленте сворачивал приложение (Telegram по умолчанию закрывает Mini App вертикальным свайпом) —
 // отключаем; прокрутка списка работает как обычно (Bot API 7.7+, в старых клиентах метода нет)
 try{if(tw.disableVerticalSwipes)tw.disableVerticalSwipes()}catch(e){}}
// Запасной способ: тянуть вниз, когда лента уже в самом верху, — гасим жест сами (иначе его ловит Telegram)
(function(){var x0=0,y0=0,sc=document.getElementById("sc");
 document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 document.addEventListener("touchmove",function(e){
  var dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;   // листание фото по горизонтали не трогаем
  var dt=document.getElementById("det"),el=dt&&!dt.hidden?dt:sc;
  if(el.scrollTop<=0&&dy>0&&Math.abs(dy)>Math.abs(dx))e.preventDefault()},{passive:false})})();
function fmtn(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" сўм"}
function render(){
 var t=document.getElementById("tabs");t.innerHTML="";
 CATS.forEach(function(c){var b=document.createElement("button");b.className="tab";b.textContent=c[1];b.setAttribute("role","tab");b.setAttribute("aria-selected",c[0]===cur);b.onclick=function(){cur=c[0];render()};t.appendChild(b)});
 var l=document.getElementById("list");l.innerHTML="";
 // при поиске — все опубликованные лоты всех разделов (search.json), без вкладок
 var searching=!!Q.trim();t.classList.toggle("off",searching);
 var subs=SUBS[cur],sub=subs?SUB[cur]:"";
 var sb=document.getElementById("subs");sb.innerHTML="";sb.hidden=searching||!subs;
 if(!sb.hidden)subs.forEach(function(s){var b=document.createElement("button");b.className="tab sub";b.setAttribute("role","tab");b.setAttribute("aria-selected",s[0]===sub);
  b.textContent=s[1]+" ("+LOTS.filter(function(x){return x.cat===cur&&subOf(x)===s[0]}).length+")";b.onclick=function(){SUB[cur]=s[0];render()};sb.appendChild(b)});
 var land=LOTS.filter(function(x){return x.cat==="mulk"&&x.sub==="yer"});
 var ch=document.getElementById("chips");ch.innerHTML="";ch.hidden=sb.hidden||cur!=="mulk"||sub!=="yer";
 if(!ch.hidden)LTAGS.forEach(function(g){var n=g[0]?land.filter(function(x){return (x.tags||[]).indexOf(g[0])>=0}).length:land.length;
  var b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",g[0]===ltag);b.textContent=g[1]+" ("+n+")";b.onclick=function(){ltag=g[0];render()};ch.appendChild(b)});
 if(searching&&!ALL){document.getElementById("count").textContent="";l.innerHTML='<div class="empty">Қидирилмоқда…</div>';return}
 var inCat=searching?found():LOTS.filter(function(x){return x.cat===cur&&(!subs||subOf(x)===sub)
  &&(cur!=="mulk"||sub!=="yer"||!ltag||(x.tags||[]).indexOf(ltag)>=0)});
 var regs=regions(inCat),sel=document.getElementById("reg");
 if(REG&&!regs.some(function(r){return r[0]===REG}))REG="";
 sel.innerHTML="";var o=document.createElement("option");o.value="";o.textContent="Барча вилоятлар ("+inCat.length+")";sel.appendChild(o);
 regs.forEach(function(r){var o=document.createElement("option");o.value=r[0];o.textContent=r[0]+" ("+r[1]+")";sel.appendChild(o)});
 sel.value=REG;
 var items=inCat.filter(function(x){return !REG||x.region===REG});
 document.getElementById("count").textContent=items.length?(searching?"«"+Q.trim()+"» бўйича топилди: ":"Топилди: ")+items.length+" та лот":"";
 if(!items.length){l.innerHTML='<div class="empty">'+(searching?"Бу модел бўйича ҳозирча лот йўқ":"Ҳозирча лотлар йўқ")+'</div>'}
 items.forEach(function(x){
  var d=x.price_orig>x.price_final?Math.round((1-x.price_final/x.price_orig)*100):0;
  var mil=x.mileage?(/^\d+$/.test(String(x.mileage))?fmtn(x.mileage)+" км":x.mileage):"";
  var m=(x.info||[]).concat([x.year?x.year+" й.":"",mil?"Пробег: "+mil:"",x.address?"":x.region]).filter(Boolean);
  var e=document.createElement("div");e.className="lot";
  var ph=(x.photos&&x.photos.length?x.photos:(x.photo?[x.photo]:[]));
  e.innerHTML=(ph.length?'<div class="gal"><div class="strip"></div>'+(ph.length>1?'<button class="nav l" aria-label="Олдинги фото">‹</button><button class="nav r" aria-label="Кейинги фото">›</button><span class="cnt">1/'+ph.length+'</span>':'')+'</div>':'')+'<div class="top"><div class="name"></div>'+(d?'<span class="disc">-'+d+'%</span>':'')+'</div><div class="meta"></div>'+(x.address?'<div class="addr"></div>':'')+'<div class="price"><span class="now">'+fmt(x.price_final)+'</span>'+(d?'<span class="old">'+fmt(x.price_orig)+'</span>':'')+'</div><div class="date">Аукцион санаси: '+x.date+'</div><div class="btns"><a class="go alt" data-lot="'+x.id+'" target="_blank" rel="noopener" href="'+((x.post_url&&x.post_url.indexOf("t.me/shocos")<0)?x.post_url:CH[x.cat])+'">Лотни кўриш</a><a class="go" target="_blank" rel="noopener" href="'+orderLink(x)+'">Ариза бериш</a></div>';
  // название — ссылка на пост лота в канале (решение пользователя 29.10)
  var nm=document.createElement("a");nm.className="nm";nm.setAttribute("data-lot",x.id);nm.target="_blank";nm.rel="noopener";nm.textContent=x.title;
  nm.href=(x.post_url&&x.post_url.indexOf("t.me/shocos")<0)?x.post_url:CH[x.cat];e.querySelector(".name").appendChild(nm);
  var st=e.querySelector(".strip");if(st){ph.forEach(function(u,i){var im=document.createElement("img");im.className="ph";im.loading="lazy";im.src=u;im.alt=x.title+" — "+(i+1);im.onerror=function(){im.remove()};st.appendChild(im)});
   var cn=e.querySelector(".cnt");st.addEventListener("scroll",function(){if(cn){cn.textContent=(Math.round(st.scrollLeft/st.clientWidth)+1)+"/"+st.children.length}},{passive:true});
   e.querySelectorAll(".nav").forEach(function(b){b.onclick=function(){st.scrollBy({left:(b.classList.contains("l")?-1:1)*st.clientWidth,behavior:"smooth"})}})}
  var ad=e.querySelector(".addr");if(ad)ad.textContent="📍 "+x.address;   // полный адрес (кўчмас мулк, 29.10)
  var mm=e.querySelector(".meta");m.forEach(function(s){var sp=document.createElement("span");sp.textContent=s;mm.appendChild(sp)});
  BYID[x.id]=x;l.appendChild(e)});
 document.getElementById("note").textContent=LOTS.some(function(x){return x.sample})?"Намуна маълумотлар. Ҳақиқий лотлар скрейпердан юкланганда алмашади.":"";
}
document.addEventListener("click",function(ev){var c=ev.target.closest&&ev.target.closest("[data-lot]");
 if(c&&BYID[c.getAttribute("data-lot")]){ev.preventDefault();ev.stopImmediatePropagation();openLot(BYID[c.getAttribute("data-lot")])}},true);
document.addEventListener("click",function(ev){var a=ev.target.closest&&ev.target.closest("a.go, a.nm, a.chan");if(a&&tw&&tw.openTelegramLink&&a.href.indexOf("https://t.me/")===0){ev.preventDefault();try{tw.openTelegramLink(a.href)}catch(e){window.open(a.href,"_blank")}
 // пост в канале (30.10): на iPhone Telegram открывает пост ПОД приложением — его не видно, кажется, что кнопка
 // не работает. Закрываем приложение, чтобы пост оказался перед глазами («Ариза бериш» — чат, его не трогаем)
 if(/^https:\/\/t\.me\/[A-Za-z0-9_]+\/\d+/.test(a.href)&&tw.close){setTimeout(function(){try{tw.close()}catch(e){}},300)}}});
function postUrl(x){return (x.post_url&&x.post_url.indexOf("t.me/shocos")<0)?x.post_url:CH[x.cat]}
// данные карточек — отдельным файлом и только при первом открытии (lots.json не растёт)
function loadDet(){if(DET||DETWAIT)return;DETWAIT=true;
 fetch("details.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){DET=j;if(OPEN)fillLot(OPEN)}).catch(function(){DET={};if(OPEN)fillLot(OPEN)})}
function openLot(x){OPEN=x;var dt=document.getElementById("det");
 var d=x.price_orig>x.price_final?Math.round((1-x.price_final/x.price_orig)*100):0;
 var ph=(x.photos&&x.photos.length?x.photos:(x.photo?[x.photo]:[]));
 var mil=x.mileage?(/^\d+$/.test(String(x.mileage))?fmtn(x.mileage)+" км":x.mileage):"";
 dt.innerHTML='<div class="dbar"><button class="back" id="dback">‹ Орқага</button></div><div class="dcard">'
  +(ph.length?'<div class="gal"><div class="strip"></div>'+(ph.length>1?'<button class="nav l" aria-label="Олдинги фото">‹</button><button class="nav r" aria-label="Кейинги фото">›</button><span class="cnt">1/'+ph.length+'</span>':'')+'</div>':'')
  +'<div class="top"><h2 class="name"></h2>'+(d?'<span class="disc">-'+d+'%</span>':'')+'</div><div class="meta"></div>'
  +'<div class="price"><span class="now">'+fmt(x.price_final)+'</span>'+(d?'<span class="old">'+fmt(x.price_orig)+'</span>':'')+'</div>'
  +'<div class="date">Аукцион санаси: '+x.date+'</div><dl class="rows" id="drows"><div class="wide"><dd style="font-weight:400;color:var(--mute)">Юкланмоқда…</dd></div></dl><div id="dnote"></div>'
  +'<div class="btns" id="dbtns"><a class="go" target="_blank" rel="noopener" href="'+orderLink(x)+'">Ариза бериш</a></div>'
  +'<a class="go alt chan" target="_blank" rel="noopener" href="'+postUrl(x)+'">📢 Каналдаги постни очиш</a></div>';
 dt.querySelector(".name").textContent=x.title;
 var mm=dt.querySelector(".meta");[x.year?x.year+" й.":""].concat(x.info||[]).filter(Boolean).forEach(function(s){var sp=document.createElement("span");sp.textContent=s;mm.appendChild(sp)});
 var st=dt.querySelector(".strip");if(st){ph.forEach(function(u,i){var im=document.createElement("img");im.className="ph";im.src=u;im.alt=x.title+" — "+(i+1);im.onerror=function(){im.remove()};st.appendChild(im)});
  var cn=dt.querySelector(".cnt");st.addEventListener("scroll",function(){if(cn){cn.textContent=(Math.round(st.scrollLeft/st.clientWidth)+1)+"/"+st.children.length}},{passive:true});
  dt.querySelectorAll(".nav").forEach(function(b){b.onclick=function(){st.scrollBy({left:(b.classList.contains("l")?-1:1)*st.clientWidth,behavior:"smooth"})}})}
 document.getElementById("dback").onclick=function(){closeLot()};
 dt.hidden=false;dt.scrollTop=0;
 if(tw&&tw.BackButton){try{tw.BackButton.show()}catch(e){}}
 try{history.pushState({lot:x.id},"")}catch(e){}
 if(DET)fillLot(x);else loadDet()}
function fillLot(x){var r=(DET&&DET[x.id])||null,dl=document.getElementById("drows");if(!dl||OPEN!==x)return;dl.innerHTML="";
 // карточки ещё нет (новый лот до обновления) — хотя бы номер и адрес
 var rows=r&&r.rows&&r.rows.length?r.rows:[["Лот №",String(x.lot_number||x.id)],["Пробег",x.mileage?(/^\d+$/.test(String(x.mileage))?fmtn(x.mileage)+" км":x.mileage):""],["Манзил",x.address||x.region||""]];
 rows.forEach(function(p){if(!p[1])return;var w=document.createElement("div");if(!p[0])w.className="wide";
  if(p[0]){var t=document.createElement("dt");t.textContent=p[0];w.appendChild(t)}
  var v=document.createElement("dd");v.textContent=p[1];w.appendChild(v);dl.appendChild(w)});
 var nt=document.getElementById("dnote");nt.innerHTML="";nt.className="";
 if(r&&r.note){nt.className="dnote";var b=document.createElement("b");b.textContent="Изоҳ";nt.appendChild(b);nt.appendChild(document.createTextNode(r.note))}
 var bt=document.getElementById("dbtns");
 if(r&&r.loc){var a=document.createElement("a");a.className="go alt";a.target="_blank";a.rel="noopener";a.href=r.loc;a.textContent="📍 Локация";
  a.onclick=function(ev){if(tw&&tw.openLink){ev.preventDefault();tw.openLink(r.loc)}};bt.insertBefore(a,bt.firstChild)}
 else bt.classList.add("one")}
function closeLot(fromPop){var dt=document.getElementById("det");if(dt.hidden)return;dt.hidden=true;dt.innerHTML="";OPEN=null;
 if(tw&&tw.BackButton){try{tw.BackButton.hide()}catch(e){}}
 if(fromPop!==true){try{history.back()}catch(e){}}}
window.addEventListener("popstate",function(){closeLot(true)});
if(tw&&tw.BackButton&&tw.BackButton.onClick){try{tw.BackButton.onClick(function(){closeLot()})}catch(e){}}
// Кнопка в канале открывает приложение на своей вкладке: t.me/avtoauksion_bot/auksion?startapp=avto|yuk|mulk
(function(){var sp=tw&&tw.initDataUnsafe&&tw.initDataUnsafe.start_param||"";
 if(CATS.some(function(c){return c[0]===sp}))cur=sp})();
fetch("lots.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){LOTS=j;render()}).catch(function(){render()});
