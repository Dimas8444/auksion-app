<!doctype html>
<html lang="uz"><head><title>Аукцион лотлари</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#16213E;--mute:#5E6678;--line:#E0DDD4;--gold:#B07C22;--goldbg:#FBF3E1;--green:#1F7A4D;--btn:#16213E;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1524;--card:#18203A;--ink:#EEF0F6;--mute:#9AA3BA;--line:#2A3454;--gold:#E0B25A;--goldbg:#2A2415;--green:#58C98E;--btn:#E0B25A;--btnink:#16213E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1524;--card:#18203A;--ink:#EEF0F6;--mute:#9AA3BA;--line:#2A3454;--gold:#E0B25A;--goldbg:#2A2415;--green:#58C98E;--btn:#E0B25A;--btnink:#16213E;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "PT Sans",system-ui,sans-serif;margin:0;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font:700 22px/1.2 "PT Serif",Georgia,serif;margin:18px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:6px;z-index:5}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.list{display:grid;gap:12px;margin-top:12px}
.lot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font:700 17px/1.25 "PT Serif",Georgia,serif;min-width:0}
.disc{background:var(--goldbg);color:var(--gold);font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.meta{color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.now{font-size:19px;font-weight:700;color:var(--green)}
.old{color:var(--mute);text-decoration:line-through}
.date{font-size:17px;font-weight:700;color:var(--ink);background:var(--goldbg);border-radius:8px;padding:9px 12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{display:block;text-align:center;background:var(--btn);color:var(--btnink);text-decoration:none;border-radius:10px;padding:11px 8px;font-weight:700}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.note{margin-top:14px;font-size:12px;color:var(--mute)}
.empty{color:var(--mute);padding:24px 0;text-align:center}
</style></head><body>
<div class="wrap">
<h1>Аукцион лотлари</h1>
<p class="sub">Яқин кунлардаги аукционга қўйилган лотлар</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="list" id="list"></div>
<p class="note" id="note"></p>
</div>
<script>
var CATS=[["avto","Енгил авто"],["yuk","Юк ва махсус техника"],["mulk","Кўчмас мулк"]];
var ADMIN="https://t.me/auksion_admin";
var CH={avto:"https://t.me/avto_auksion_uz",yuk:"https://t.me/gruzovoeavto",mulk:"https://t.me/kuchmasmulk_uz"};
var cur="avto",LOTS=[];
var tw=window.Telegram&&window.Telegram.WebApp;if(tw){try{tw.ready();tw.expand()}catch(e){}}
function fmtn(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" сўм"}
function render(){
 var t=document.getElementById("tabs");t.innerHTML="";
 CATS.forEach(function(c){var b=document.createElement("button");b.className="tab";b.textContent=c[1];b.setAttribute("role","tab");b.setAttribute("aria-selected",c[0]===cur);b.onclick=function(){cur=c[0];render()};t.appendChild(b)});
 var l=document.getElementById("list");l.innerHTML="";
 var items=LOTS.filter(function(x){return x.cat===cur});
 if(!items.length){l.innerHTML='<div class="empty">Ҳозирча лотлар йўқ</div>'}
 items.forEach(function(x){
  var d=x.price_orig>x.price_final?Math.round((1-x.price_final/x.price_orig)*100):0;
  var mil=x.mileage?(/^\d+$/.test(String(x.mileage))?fmtn(x.mileage)+" км":x.mileage):"";
  var m=[x.year?x.year+" й.":"",mil?"Пробег: "+mil:"",x.region].filter(Boolean).join("|").split("|");
  var e=document.createElement("div");e.className="lot";
  e.innerHTML='<div class="top"><div class="name"></div>'+(d?'<span class="disc">-'+d+'%</span>':'')+'</div><div class="meta"></div><div class="price"><span class="now">'+fmt(x.price_final)+'</span>'+(d?'<span class="old">'+fmt(x.price_orig)+'</span>':'')+'</div><div class="date">Аукцион санаси: '+x.date+'</div><div class="btns"><a class="go alt" target="_blank" rel="noopener" href="'+(x.post_url||CH[x.cat])+'">Лотни кўриш</a><a class="go" target="_blank" rel="noopener" href="'+ADMIN+'">Ариза бериш</a></div>';
  e.querySelector(".name").textContent=x.title;
  var mm=e.querySelector(".meta");m.forEach(function(s){var sp=document.createElement("span");sp.textContent=s;mm.appendChild(sp)});
  l.appendChild(e)});
 document.getElementById("note").textContent=LOTS.some(function(x){return x.sample})?"Намуна маълумотлар. Ҳақиқий лотлар скрейпердан юкланганда алмашади.":"";
}
fetch("lots.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){LOTS=j;render()}).catch(function(){render()});
</script>
</body></html>
